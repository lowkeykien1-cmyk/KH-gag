services:
  - type: web
    name: kyosh-control
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
      - key: ROBLOX_API_KEY
        sync: false
      - key: HEARTBEAT_TIMEOUT_SECONDS
        value: "90"
      - key: DEMO_MODE
        value: "true"
